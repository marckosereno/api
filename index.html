<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extractor de Dentistas Nuevo Progreso</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f4f4f9; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #007bff; }
        button { padding: 10px 20px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:disabled { background-color: #6c757d; }
        #results { margin-top: 20px; }
        .list-item { border-bottom: 1px solid #eee; padding: 10px 0; }
        .name { font-weight: bold; color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏥 Extractor de Clínicas Dentales</h1>
        <p>Herramienta para superar el límite de la API de Places usando múltiples consultas y paginación en Nuevo Progreso.</p>
        
        <button id="extractBtn">Comenzar Extracción</button>
        
        <p id="statusMsg" style="margin-top: 15px; color: #007bff;">Presiona el botón para iniciar la búsqueda...</p>

        <div id="results">
            </div>
    </div>

    <script>
        document.getElementById('extractBtn').addEventListener('click', async () => {
            const btn = document.getElementById('extractBtn');
            const statusMsg = document.getElementById('statusMsg');
            const resultsDiv = document.getElementById('results');

            btn.disabled = true;
            statusMsg.textContent = 'Buscando en múltiples páginas y consultas... ¡Esto puede tardar unos segundos!';
            resultsDiv.innerHTML = '';

            try {
                // Llama a la Serverless Function de Vercel
                const response = await fetch('/api/dentistas'); 
                const data = await response.json();

                if (data.error) {
                    statusMsg.textContent = `Error: ${data.error}`;
                    statusMsg.style.color = 'red';
                    return;
                }

                statusMsg.textContent = data.message;
                statusMsg.style.color = '#28a745';

                data.dentists.forEach((dentist, index) => {
                    const div = document.createElement('div');
                    div.className = 'list-item';
                    div.innerHTML = `
                        <div class="name">${index + 1}. ${dentist.name}</div>
                        <div>Dirección: ${dentist.address}</div>
                        <div>Rating: ${dentist.rating}</div>
                        <div>ID: ${dentist.id}</div>
                    `;
                    resultsDiv.appendChild(div);
                });

            } catch (error) {
                statusMsg.textContent = `Error de conexión: ${error.message}`;
                statusMsg.style.color = 'red';
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
