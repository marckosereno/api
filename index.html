<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progreso Tour Guide</title>
<link href="https://fonts.cdnfonts.com/css/avenir" rel="stylesheet">
                
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        /* Estilos base */
        html, body { font-family:Avenir; height: 100%; margin: 0; padding: 0; }
        .chat-window { height: 100%; width: 100vw; display: flex; flex-direction: column; background-color: #f7f7f7; overflow: hidden }
        .user-bubble { border-radius: 18px 18px 0 18px; max-width: 80% }
        .model-bubble { border-radius: 18px 18px 18px 0; max-width: 80%;padding-left:8px; white-space: pre-wrap; /* Necesario para listas de Gemini */ }
        .action-bar-container { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-top: 10px; padding-bottom: 5px }
        .action-btn { white-space: nowrap }
        .chip-group-scroll { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; white-space: nowrap; }
        
        /* Estilo de la barra de chat */
        .map-search-bar {
            background-color: white; 
            border-radius: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.06);
            border: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            padding: 4px; 
            width: 100%; 
            box-sizing: border-box; 
        }
        .map-input {
            flex-grow: 1;
            padding: 0.75rem 0.75rem; 
            color: #9ca3af;
            font-size: 1.125rem;
            background: transparent;
            border: none;
            min-width: 0; 
            outline: none !important;
            box-shadow: none !important;
        }
        .go-button {
            background-color: black;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 15px;
            padding: 0.5rem 1rem; 
            display: flex;
            align-items: center;
            justify-content: center;
            transition: hover:opacity-90 disabled:opacity-50;
            flex-shrink: 0;
            min-width: 60px;
            height: 44px;
            box-sizing: border-box;
            margin-right: 4px;
            outline: none !important;
        }
        .go-button svg {
            margin-right: 0.25rem;
            width: 1.25rem; 
            height: 1.25rem;
            fill: currentColor;
        }

        /* --- Eliminación de Efecto Celeste/Ring/Highlight en TODOS los botones y chips --- */
        
        /* 1. Para navegadores basados en Webkit (Chrome, Safari, Android) */
        * {
            -webkit-tap-highlight-color: transparent !important; /* SOLUCIÓN CLAVE para el toque en móvil */
        }
        
        /* 2. Asegura la eliminación del outline/ring en estados focus/active */
        .action-chip, .category-chip, .language-chip, .go-button, .map-input {
            outline: none !important;
            box-shadow: none !important;
            --tw-ring-color: transparent !important;
        }
        .action-chip:focus, .action-chip:active, .category-chip:focus, .category-chip:active, .language-chip:focus, .language-chip:active, .go-button:focus, .go-button:active {
            outline: none !important;
            box-shadow: none !important;
            --tw-ring-color: transparent !important;
        }
        .hover\:bg-gray-300:active {
            background-color: #d1d5db; /* mantiene el color del hover al hacer click */
        }
        
        /* --- Efecto Ola y Transición para los Chips --- */
        .category-chip, .language-chip {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.3s ease-out, transform 0.3s ease-out;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
        }
        .visible-chip {
            opacity: 1;
            transform: translateY(0);
        }

        /* Estilo para el Timestamp */
        .timestamp {
            font-size: 0.7rem; /* Fuente pequeña */
            color: #9ca3af; /* Color gris suave */
            margin-top: 2px;
        }
    </style>
    <script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.8.5/dist/dotlottie-wc.js" type="module"></script>
</head>
<body>
    <div id="chat-window" class="chat-window h-screen w-full"> 
        <div class="flex items-center justify-between p-4 bg-white text-gray-800 font-bold border-b border-gray-200 flex-shrink-0 shadow-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-green-500" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" /></svg>
            <span id="header-text" class="text-lg">PROGRESO TOUR GUIDE</span>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-600 cursor-pointer" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" onclick="clearChatHistory()"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
        </div>

        <div id="message-container" class="flex-grow overflow-y-auto p-4 flex flex-col"></div>

        <div id="loading-indicator" class="flex justify-start hidden p-4 pl-1 flex-shrink-0" style="margin-left:-42px;margin-bottom:-22px;">
            <dotlottie-wc src="https://lottie.host/65b2d1fc-9840-476c-867e-6236ce234b38/SwsGK4ZVOj.lottie" style="width: 150px; height:" autoplay loop></dotlottie-wc>
        </div>
        
        <div id="app-alert-container" class="fixed top-2 w-full flex justify-center z-50"></div>

        <div id="quick-replies-container" class="quick-replies-container p-2 border-t border-gray-100 bg-white flex-shrink-0 flex flex-col space-y-2">
            
            <div id="category-chips-group" class="chip-group-scroll hidden">
                <div id="category-chips-list" class="inline-flex space-x-3 pb-3 border-b border-gray-200"> 
                    <div class="category-chip flex items-center p-2 rounded-xl text-sm border border-green-500 bg-green-50 text-green-700 cursor-pointer transition hover:bg-green-100" data-query-es="Dime sobre la Categoría Salud y Estética en Progreso" data-query-en="Tell me about the Health and Beauty Category in Progreso">🏥 Salud & Estética</div>
                    <div class="category-chip flex items-center p-2 rounded-xl text-sm border border-blue-500 bg-blue-50 text-blue-700 cursor-pointer transition hover:bg-blue-100" data-query-es="Dime sobre la Categoría Compras y Tiendas en Progreso" data-query-en="Tell me about the Shopping and Stores Category in Progreso">🛍️ Compras</div>
                    <div class="category-chip flex items-center p-2 rounded-xl text-sm border border-purple-500 bg-purple-50 text-purple-700 cursor-pointer transition hover:bg-purple-100" data-query-es="Dime sobre la Categoría Entretenimiento y Atracciones en Progreso" data-query-en="Tell me about the Entertainment and Attractions Category in Progreso">🎺 Entretenimiento</div>
                    <div class="category-chip flex items-center p-2 rounded-xl text-sm border border-yellow-500 bg-yellow-50 text-yellow-700 cursor-pointer transition hover:bg-yellow-100" data-query-es="Recomiéndame 10 dentistas en Progreso" data-query-en="Recommend 10 dentists in Progreso">🦷 Top 10 Dental</div>
                </div>
            </div>

            <div id="language-chips-group" class="chip-group-scroll hidden">
                <div class="inline-flex space-x-3 pb-3 border-b border-gray-200"> 
                    <div class="language-chip flex items-center p-2 rounded-full text-sm font-semibold border border-gray-400 bg-white text-gray-800 cursor-pointer transition hover:bg-gray-100" data-lang="es">🇪🇸 Español</div>
                    <div class="language-chip flex items-center p-2 rounded-full text-sm font-semibold border border-gray-400 bg-white text-gray-800 cursor-pointer transition hover:bg-gray-100" data-lang="en">🇺🇸 English</div>
                </div>
            </div>
            
            <div id="menu-actions" class="chip-group-scroll">
                <div class="inline-flex space-x-3 pt-2">
                    <div id="btn-categorias" class="menu-action-chip action-chip flex items-center p-2 rounded-full text-sm font-semibold bg-gray-200 text-gray-800 cursor-pointer transition hover:bg-gray-300" data-action="CATEGORIES">📂 Categorías</div>
                    <div id="btn-lenguaje" class="menu-action-chip action-chip flex items-center p-2 rounded-full text-sm font-semibold bg-gray-200 text-gray-800 cursor-pointer transition hover:bg-gray-300" data-action="LANGUAGE">🌐 Lenguaje</div>
                    <div id="btn-comollegar" class="menu-action-chip action-chip flex items-center p-2 rounded-full text-sm font-semibold bg-gray-200 text-gray-800 cursor-pointer transition hover:bg-gray-300" data-action="GET_THERE" data-query-es="Dime cómo llegar a Progreso, Tamaulipas." data-query-en="Tell me how to get to Progreso, Tamaulipas.">📍 Cómo Llegar</div>
                    <div id="btn-info" class="menu-action-chip action-chip flex items-center p-2 rounded-full text-sm font-semibold bg-gray-200 text-gray-800 cursor-pointer transition hover:bg-gray-300" data-action="INFO" data-query-es="Información general sobre Nuevo Progreso." data-query-en="General information about Nuevo Progreso.">ℹ️ Info</div>
                </div>
            </div>
        </div>
        
        <div class="p-4 bg-white shadow-xl flex-shrink-0">
            <div class="map-search-bar w-full">
                <input type="text" id="user-input" class="map-input focus:outline-none focus:ring-0" placeholder="Pregúntale al mapa">
                
                <button id="go-button" class="go-button transition hover:opacity-90 disabled:opacity-50">
                    <svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px" viewBox="0 0 122.88 122.88" class="h-5 w-5"><g><path class="st0" d="M62.43,122.88h-1.98c0-16.15-6.04-30.27-18.11-42.34C30.27,68.47,16.16,62.43,0,62.43v-1.98 c16.16,0,30.27-6.04,42.34-18.14C54.41,30.21,60.45,16.1,60.45,0h1.98c0,16.15,6.04,30.27,18.11,42.34 c12.07,12.07,26.18,18.11,42.34,18.11v1.98c-16.15,0-30.27,6.04-42.34,18.11C68.47,92.61,62.43,106.72,62.43,122.88L62.43,122.88z"/></g></svg>
                    <span id="go-text">Ir</span> 
                </button>
            </div>
        </div>
    </div>

<script>
    // --- BLOQUE JAVASCRIPT: CONFIGURACIÓN Y UTILIDADES ---
    
    // **NOTA: Debe coincidir con el endpoint de Vercel/backend**
    const BACKEND_URL = "/api/chat"; 
    
    // --- GESTIÓN DE HISTORIAL Y TOKENS (SOLUCIÓN A LA PERSISTENCIA) ---
    const HISTORY_STORAGE_KEY = 'progreso_chat_history';
    const MAX_MESSAGES = 10; // 5 preguntas de usuario + 5 respuestas de Gemini (Para limitar tokens)

    let currentLanguage = 'es'; 
    let categoriesVisible = false; 
    let languageMenuVisible = false; 
    
    // NUEVO: Lista de categorías sensibles para control en el frontend
    const SENSITIVE_CATEGORIES = [
        'clinicas_dentales', 
        'farmacias',
        'opticas',
        'esteticas',
        'salud' // Añadir si la categoría general "Salud y Estética" también debe ser sensible
    ];


    // Referencias a Elementos del DOM
    const inputElement = document.getElementById('user-input');
    const sendButton = document.getElementById('go-button'); 
    const messageContainer = document.getElementById('message-container');
    const loadingIndicator = document.getElementById('loading-indicator');
    const appAlertContainer = document.getElementById('app-alert-container');
    const categoryChipsGroup = document.getElementById('category-chips-group');
    const languageChipsGroup = document.getElementById('language-chips-group');
    const categoryChips = document.querySelectorAll('#category-chips-group .category-chip');
    const languageChips = document.querySelectorAll('#language-chips-group .language-chip');
    const menuActionChips = document.querySelectorAll('#menu-actions .menu-action-chip');
    
    // Objeto de Traducción y textos de chips
    const UI_STRINGS = {
        es: {
            header: "PROGRESO TOUR GUIDE",
            placeholder: "Pregúntale al mapa",
            goButton: "Ir",
            categories: "📂 Categorías",
            language: "🌐 Lenguaje",
            getThere: "📍 Cómo Llegar",
            info: "ℹ️ Info",
            alertStructured: (name) => `¡Ficha verificada de ${name}!`,
            alertCategory: (name) => `Resumen de la categoría ${name}.`,
            chipHealth: "🏥 Salud & Estética",
            chipShopping: "🛍️ Compras",
            chipEntertainment: "🎺 Entretenimiento",
            chipDental: "🦷 Top 10 Dental",
            call: "Llamar 📞",
            reviews: "Reseñas ⭐",
            map: "Ver en Mapa 🗺️",
            search: "Buscar en Google 🔍",
            recommend: "Dame Recomendaciones", // Modificado para un texto más genérico
            unavailable: "No disponible."
        },
        en: {
            header: "PROGRESO TOUR GUIDE",
            placeholder: "Ask the map",
            goButton: "Go",
            categories: "📂 Categories",
            language: "🌐 Language",
            getThere: "📍 How to get there",
            info: "ℹ️ Info",
            alertStructured: (name) => `Verified card for ${name}!`,
            alertCategory: (name) => `Summary for ${name} category.`,
            chipHealth: "🏥 Health & Beauty",
            chipShopping: "🛍️ Shopping",
            chipEntertainment: "🎺 Entertainment",
            chipDental: "🦷 Top 10 Dental",
            call: "Call 📞",
            reviews: "Reviews ⭐",
            map: "View on Map 🗺️",
            search: "Search on Google 🔍",
            recommend: "Give me Recommendations", // Modificado para un texto más genérico
            unavailable: "Unavailable."
        }
    };

    /** Carga el historial desde localStorage y lo trunca si es muy largo. */
    function getChatHistory() {
        const storedHistory = localStorage.getItem(HISTORY_STORAGE_KEY);
        let history = storedHistory ? JSON.parse(storedHistory) : [];
        return history;
    }

    /** Trunca el historial a los últimos X mensajes para ahorrar tokens. */
    function getLimitedHistoryForAPI(history) {
        if (history.length > MAX_MESSAGES) {
            return history.slice(history.length - MAX_MESSAGES);
        }
        return history;
    }

    /** Añade el nuevo turno de conversación al historial y lo guarda. */
    function updateAndSaveHistory(userMessage, modelMessage) {
        let history = getChatHistory();
        
        // El historial del modelo solo debe guardar el texto, no el objeto estructurado completo
        const modelTextToSave = modelMessage.isStructured && modelMessage.text ? modelMessage.text : modelMessage.text;

        history.push({ role: "user", text: userMessage, timestamp: modelMessage.timestamp });
        history.push({ role: "model", text: modelTextToSave, timestamp: modelMessage.timestamp });

        localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(history));
    }
    
    /** Limpia el historial de localStorage y la UI. */
    function clearChatHistory() {
        if (confirm(currentLanguage === 'es' ? "¿Estás seguro de que quieres borrar todo el historial de chat?" : "Are you sure you want to clear the entire chat history?")) {
            localStorage.removeItem(HISTORY_STORAGE_KEY);
            chatHistory = []; // Resetear la variable local
            renderChat(); // Renderizar chat vacío
            renderInitialMessage(); // Mostrar mensaje de bienvenida
            alertUser(currentLanguage === 'es' ? "Historial de chat limpiado." : "Chat history cleared.", 'i');
        }
    }

    // --- Funciones de utilidad de tiempo ---
    function formatTime(date) {
        if (!date) return '';
        // Convierte la marca de tiempo de la base de datos a un objeto Date si es necesario
        if (typeof date === 'string' || typeof date === 'number') {
            date = new Date(date);
        }
        let hours = date.getHours();
        const minutes = date.getMinutes();
        const ampm = hours >= 12 ? 'pm' : 'am';
        hours = hours % 12;
        hours = hours ? hours : 12;
        const minutesStr = minutes < 10 ? '0'+minutes : minutes;
        return hours + ':' + minutesStr + ' ' + ampm;
    }

    function alertUser(m, t='i') {
        if (appAlertContainer && appAlertContainer.querySelector('.app-alert')) appAlertContainer.querySelector('.app-alert').remove();
        const a = document.createElement('div');
        const bg = (t === 'error') ? 'bg-red-500' : 'bg-blue-500';
        a.className = `app-alert p-3 rounded-lg text-white font-semibold shadow-lg transition-opacity duration-300 z-50 ${bg} mb-2`;
        a.textContent = m;
        if (appAlertContainer) appAlertContainer.appendChild(a);
        setTimeout(() => { a.style.opacity = '0'; setTimeout(() => a.remove(), 300); }, 4000);
    }
    
    function scrollToBottom() { 
        if (messageContainer) messageContainer.scrollTop = messageContainer.scrollHeight; 
    }
    
    function toggleInput(d) {
        if (inputElement) inputElement.disabled = d;
        if (sendButton) sendButton.disabled = d;
        if (loadingIndicator) loadingIndicator.classList.toggle('hidden', d);
        if (inputElement) inputElement.placeholder = d ? (currentLanguage === 'es' ? "Pensando..." : "Thinking...") : UI_STRINGS[currentLanguage].placeholder;
    }

    // --- FUNCIONES DE INTERACCIÓN Y UI ---

    function vibrateDevice() {
        if ("vibrate" in navigator) {
            navigator.vibrate(100); 
        }
    }
    
    function hideChipGroup(groupElement, chipElements) {
        groupElement.classList.add('hidden');
        chipElements.forEach(chip => {
            chip.classList.remove('visible-chip');
        });
    }

    function showChipGroupWithWave(groupElement, chipElements) {
        groupElement.classList.remove('hidden');
        chipElements.forEach((chip, index) => {
            chip.style.transition = 'none';
            chip.classList.remove('visible-chip');

            void chip.offsetWidth; 

            setTimeout(() => {
                chip.style.transition = 'opacity 0.3s ease-out, transform 0.3s ease-out';
                chip.classList.add('visible-chip');
            }, index * 100); 
        });
    }

    function setInterfaceLanguage(lang) {
        currentLanguage = lang;
        const strings = UI_STRINGS[lang];
        
        // Ocultar menú de lenguaje
        hideChipGroup(languageChipsGroup, languageChips);
        languageMenuVisible = false;

        // Actualizar textos de la interfaz
        document.getElementById('header-text').textContent = strings.header;
        inputElement.placeholder = strings.placeholder;
        document.getElementById('go-text').textContent = strings.goButton; 

        document.getElementById('btn-categorias').textContent = strings.categories;
        document.getElementById('btn-lenguaje').textContent = strings.language;
        document.getElementById('btn-comollegar').textContent = strings.getThere;
        document.getElementById('btn-info').textContent = strings.info;

        // Actualizar textos de los chips de categoría
        const categoryChipTexts = [strings.chipHealth, strings.chipShopping, strings.chipEntertainment, strings.chipDental];
        categoryChips.forEach((chip, index) => {
            chip.textContent = categoryChipTexts[index];
        });

        alertUser(`Interfaz y conversación cambiadas a ${lang === 'es' ? 'Español' : 'English'}`, 'i');
    }

    // Lógica para el menú de acciones
    function handleMenuAction(actionChip) {
        const action = actionChip.getAttribute('data-action');
        const lang = currentLanguage;
        const query = actionChip.getAttribute(`data-query-${lang}`);

        vibrateDevice(); 

        // Lógica para ocultar otros menús y resetear estados
        if (action !== 'CATEGORIES' && categoriesVisible) {
            hideChipGroup(categoryChipsGroup, categoryChips);
            categoriesVisible = false;
        }
        if (action !== 'LANGUAGE' && languageMenuVisible) {
            hideChipGroup(languageChipsGroup, languageChips);
            languageMenuVisible = false;
        }

        if (action === 'CATEGORIES') {
            if (categoriesVisible) {
                hideChipGroup(categoryChipsGroup, categoryChips);
                categoriesVisible = false;
            } else {
                showChipGroupWithWave(categoryChipsGroup, categoryChips);
                categoriesVisible = true;
            }
        } else if (action === 'LANGUAGE') {
            if (languageMenuVisible) {
                hideChipGroup(languageChipsGroup, languageChips);
                languageMenuVisible = false;
            } else {
                showChipGroupWithWave(languageChipsGroup, languageChips);
                languageMenuVisible = true;
            }
        } else {
            // Acciones directas (Cómo Llegar, Info)
            if (query) {
                handleSend(query); 
                if (categoriesVisible) { hideChipGroup(categoryChipsGroup, categoryChips); categoriesVisible = false; }
                if (languageMenuVisible) { hideChipGroup(languageChipsGroup, languageChips); languageMenuVisible = false; }
            }
        }
    }
    
    // Función para crear las burbujas de mensaje (User/Model)
    function createMessageBubble(m) {
        const w = document.createElement('div');
        
        const timeStr = formatTime(m.timestamp);
        const timeSpan = timeStr ? `<span class="timestamp">${timeStr}</span>` : '';

        if (m.role === 'user') { 
            w.className = 'flex justify-end mb-2'; 
            w.innerHTML = `
                <div class="flex flex-col items-end">
                    <div class="user-bubble bg-blue-500 text-white p-3 shadow-md">${m.text}</div>
                    ${timeSpan}
                </div>
            `; 
        } 
        else if (m.role === 'model') {
            w.className = 'flex flex-col justify-start w-full mb-2';
            let content = '';
            const strings = UI_STRINGS[currentLanguage];

            if (m.isStructured) { 
                
                // 🛑 Lógica de Contenido Estructurado 🛑
                const isPlace = m.type === 'place';
                const isCategory = m.type === 'category';

                const entityName = isPlace ? m.placeName : m.categoryName;
                
                // NUEVO: Verificamos si es una categoría sensible/de salud
                const isSensitive = SENSITIVE_CATEGORIES.some(cat => 
                    (m.text && m.text.toLowerCase().includes(cat.toLowerCase().replace(/_/g, ' '))) || 
                    (m.categoryName && m.categoryName.toLowerCase().includes(cat.toLowerCase().replace(/_/g, ' ')))
                );
                
                // Alerta de respuesta estructurada
                const alertText = isPlace 
                    ? strings.alertStructured(entityName)
                    : strings.alertCategory(entityName);

                if (typeof alertUser === 'function') alertUser(alertText, "i");

                // Contenido de la burbuja (Descripción de Gemini/Backend)
                // Usamos innerHTML para respetar el formato Markdown/lista del backend
                content = `<div class="model-bubble bg-gray-200 text-gray-800 p-3 shadow-md">${m.text || m.description}</div>`;
                
                // --- Generación de la Barra de Acciones ---
                let actionsHTML = '';
                let mapUrl = '#';
                let searchUrl = '#';

                // 1. URLs base para búsqueda/mapa
                if (isPlace && m.mapUrl) {
                    mapUrl = m.mapUrl;
                } else if (isCategory || isPlace) {
                    const searchName = entityName ? encodeURIComponent(entityName + " Nuevo Progreso Tamps") : 'Nuevo+Progreso+Tamaulipas';
                    mapUrl = `https://www.google.com/maps/search/?api=1&query=${searchName}`; // Corregido el formato de URL de Google Maps
                    searchUrl = `https://www.google.com/search?q=${searchName}`;
                }

                // 2. Botón VER EN MAPA (SIEMPRE VISIBLE)
                actionsHTML += `
                    <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="action-btn bg-green-500 text-white font-semibold py-2 px-4 rounded-lg hover:bg-green-600 transition flex-shrink-0 text-sm">${strings.map}</a>
                `;

                // 3. Botones específicos para LUGAR (Teléfono y Reseñas)
                // SOLO se muestran si NO es una categoría sensible
                if (isPlace && !isSensitive) {
                    const isPhoneAvailable = !!m.placePhone;
                    actionsHTML += `
                        <a href="${m.placePhone ? `tel:${m.placePhone}` : 'javascript:void(0)'}" onclick="${m.placePhone ? '' : `alert('${strings.unavailable}')`}" class="action-btn ${isPhoneAvailable ? 'bg-blue-500 hover:bg-blue-600' : 'bg-gray-400 cursor-not-allowed' } text-white font-semibold py-2 px-4 rounded-lg transition flex-shrink-0 text-sm">${strings.call}</a>
                        <a href="${m.reviewUrl || mapUrl}" target="_blank" rel="noopener noreferrer" class="action-btn bg-yellow-400 text-gray-800 font-semibold py-2 px-4 rounded-lg hover:bg-yellow-500 transition flex-shrink-0 text-sm">${strings.reviews}</a>
                    `;
                }

                // 4. Botón Buscar en Google (SIEMPRE VISIBLE)
                actionsHTML += `
                    <a href="${searchUrl}" target="_blank" rel="noopener noreferrer" class="action-btn bg-gray-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-gray-700 transition flex-shrink-0 text-sm">${strings.search}</a>
                `;
                
                // 5. Botón de Recomendación (Solo si es CATEGORÍA)
                // Dispara el prompt para obtener la lista interna
                if (isCategory) {
                    const recommendPrompt = `${strings.recommend} ${entityName} en Nuevo Progreso.`;
                    actionsHTML += `
                        <button onclick="handleSend('${recommendPrompt.replace(/'/g, "\\'")}')" class="action-btn bg-yellow-400 text-gray-800 font-semibold py-2 px-4 rounded-lg hover:bg-yellow-500 transition flex-shrink-0 text-sm">${strings.recommend}</button>
                    `;
                }

                const actionsBar = `
                    <div class="action-bar-container">
                        <div class="inline-flex space-x-3 p-1">
                            ${actionsHTML}
                        </div>
                    </div>
                `;
                
                w.innerHTML = `
                    <div class="flex flex-col items-start">
                        ${content}
                        ${actionsBar}
                        ${timeSpan}
                    </div>
                `;

            } else {
                // Mensaje de texto plano conversacional
                content = `<div class="model-bubble bg-gray-200 text-gray-800 p-3 shadow-md">${m.text || ''}</div>`;
                w.innerHTML = `
                    <div class="flex flex-col items-start">
                        ${content}
                        ${timeSpan}
                    </div>
                `;
            }
        }
        return w;
    }

    function renderChat() {
        if (messageContainer) {
            messageContainer.innerHTML = '';
            chatHistory.forEach((m) => { messageContainer.appendChild(createMessageBubble(m)); });
            scrollToBottom();
        }
    }
    
    function renderInitialMessage() {
        // Cargar historial
        const loadedHistory = getChatHistory();
        chatHistory = loadedHistory.map(m => ({
            ...m,
            // Asegurar que timestamp sea un objeto Date
            timestamp: new Date(m.timestamp)
        }));

        if (chatHistory.length === 0) {
            const welcomeText = currentLanguage === 'es' 
                ? '¡Hola! Soy tu guía de PROGRESO TOUR GUIDE. Pregúntame sobre **dentistas, farmacias, restaurantes, estéticas** o cualquier lugar de Nuevo Progreso.'
                : 'Hi! I am your PROGRESO TOUR GUIDE. Ask me about **dentists, pharmacies, restaurants, beauty salons** or any place in Nuevo Progreso.';
            
            // Renderizar solo el mensaje de bienvenida, sin guardarlo en el historial
            messageContainer.appendChild(createMessageBubble({ role: 'model', text: welcomeText, timestamp: new Date() }));

        } else {
            // Reconstruir la conversación
            renderChat();
            const welcomeBackText = currentLanguage === 'es' ? '¡Bienvenido de vuelta! ¿En qué más puedo ayudarte hoy?' : 'Welcome back! How else can I help you today?';
            messageContainer.appendChild(createMessageBubble({ role: 'model', text: welcomeBackText, timestamp: new Date() }));
        }
        scrollToBottom();
    }


    // --- LÓGICA PRINCIPAL DE ENVÍO (handleSend) ---
    async function handleSend(userPromptInput = null) {
        const userPrompt = userPromptInput || inputElement.value.trim();
        if (!userPrompt) return;
        
        // Ocultar chips de menú
        hideChipGroup(categoryChipsGroup, categoryChips);
        categoriesVisible = false;
        hideChipGroup(languageChipsGroup, languageChips);
        languageMenuVisible = false;

        toggleInput(true);
        
        const timestamp = new Date();
        
        // 1. Mostrar mensaje del usuario y limpiar input
        chatHistory.push({ role: 'user', text: userPrompt, timestamp: timestamp });
        renderChat();
        inputElement.value = '';

        // 2. Preparar historial para la API (truncado)
        const limitedHistory = getLimitedHistoryForAPI(chatHistory);
        
        // 3. Obtener respuesta de Gemini
        const modelResponseText = await getGeminiResponse(userPrompt, limitedHistory);
        
        let finalMessage = { role: 'model', text: modelResponseText, timestamp: new Date() };

        if (!modelResponseText) {
            // Si hay un error, el mensaje de error ya se mostró en alertUser dentro de getGeminiResponse
            // Solo necesitamos devolver el control al usuario.
            toggleInput(false);
            return;
        }

        // 4. Intentar parsear la respuesta como JSON estructurado
        try {
            const jsonStart = modelResponseText.indexOf('{');
            const jsonEnd = modelResponseText.lastIndexOf('}');
            
            if (jsonStart !== -1 && jsonEnd !== -1) {
                const jsonString = modelResponseText.substring(jsonStart, jsonEnd + 1);
                const parsedJson = JSON.parse(jsonString);

                if (parsedJson.isStructured === true) {
                    // Mapeo de JSON a objeto de mensaje local para el renderizado
                    finalMessage = {
                        role: 'model',
                        isStructured: true,
                        type: parsedJson.type, 
                        text: parsedJson.description || modelResponseText, 
                        // Campos específicos para 'place'
                        placeName: parsedJson.placeName, 
                        placePhone: parsedJson.placePhone, 
                        mapUrl: parsedJson.mapUrl,
                        reviewUrl: parsedJson.reviewUrl,
                        // Campos específicos para 'category'
                        categoryName: parsedJson.categoryName,
                        timestamp: finalMessage.timestamp
                    };
                }
            }
        } catch (e) {
            console.error("Error al parsear JSON estructurado:", e);
            finalMessage.text = modelResponseText; // Volver al texto plano si el parseo falla
        }

        // 5. Actualizar Historial y UI
        updateAndSaveHistory(userPrompt, finalMessage); // Guarda la respuesta limpia
        chatHistory = getChatHistory(); // Recarga el historial actualizado
        
        renderChat();
        toggleInput(false);
    }
    
    // --- Lógica de Llamada a la API (CORREGIDA) ---
    async function getGeminiResponse(userPrompt, limitedHistory) {
        
        const historyForAPI = limitedHistory.map(m => {
            return {
                role: m.role,
                parts: [{ text: m.text }]
            };
        });

        // 🟢 CORRECCIÓN CLAVE 1: Prepara el array 'contents' para la API de Gemini
        // Añadimos el prompt del usuario al final del historial como el último turno.
        const contents = [...historyForAPI, { role: 'user', parts: [{ text: userPrompt }] }]; 

        try {
            const response = await fetch(BACKEND_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    // 🟢 CORRECCIÓN CLAVE 2: Enviamos 'contents' y 'currentLanguage'
                    contents: contents, 
                    currentLanguage: currentLanguage
                }) 
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(`Error HTTP: ${response.status}. Mensaje: ${errorData.message || 'El servicio de chat falló.'}`);
            }

            const data = await response.json();
            // El backend ahora devuelve 'responseText'
            return data.responseText; 

        } catch (error) {
            console.error("Fallo del Proxy o API de Gemini:", error);
            alertUser(`Error de conexión: ${error.message}.`, 'error');
            return null;
        }
    }


    // --- Event Listeners e Inicio ---
    
    // Listener principal de envío (botón y Enter)
    if (sendButton) sendButton.addEventListener('click', () => handleSend());
    if (inputElement) inputElement.addEventListener('keypress', function(e) { 
        if (e.key === 'Enter') { handleSend(); } 
    });
    
    // Listeners para botones del menú principal (Categorías, Lenguaje, etc.)
    menuActionChips.forEach(chip => {
        chip.addEventListener('click', function() {
            handleMenuAction(this);
        });
    });

    // Listeners para chips de Categoría (envían la consulta y ocultan el menú)
    categoryChips.forEach(chip => {
        chip.addEventListener('click', function() {
            const lang = currentLanguage;
            const query = this.getAttribute(`data-query-${lang}`);
            handleSend(query); 
            // El menú se oculta dentro de handleSend/handleMenuAction
        });
    });

    // Listeners para chips de Idioma
    languageChips.forEach(chip => {
        chip.addEventListener('click', function() {
            const lang = this.getAttribute('data-lang');
            setInterfaceLanguage(lang);
        });
    });

    document.addEventListener('DOMContentLoaded', () => {
        // Inicializa la interfaz y carga el historial guardado
        renderInitialMessage();
        // Inicializa el idioma de la UI
        setInterfaceLanguage('es'); 
    });
</script>
