<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progreso Tour Guide Chat</title>
    
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    
    <link href="styles/main.css" rel="stylesheet">
    
    <link href="https://db.onlinewebfonts.com/c/0991fb109ac529a8f639460d21e766cf?family=Spline+Sans+Light" rel="stylesheet">
    <link href="https://db.onlinewebfonts.com/c/c583d0702911444628b39c6d070d99c4?family=Spline+Sans+Medium" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/avenir" rel="stylesheet">
    <link href="https://db.onlinewebfonts.com/c/ddadf4e5d67469bf2fb13ca47ac078ba?family=FH+Oscar+Test+Medium" rel="stylesheet">
</head>
<body class="h-full bg-gray-50">

    <div class="chat-window relative h-full flex flex-col max-w-lg mx-auto bg-white shadow-xl">
        
        <div class="header-container fixed top-0 left-0 right-0 z-40 bg-white shadow-md p-4 flex items-center justify-between">
            <h1 class="text-xl font-bold text-gray-800" id="header-title">
                PROGRESO TOUR GUIDE
            </h1>
            <button id="btn-clear-history" class="p-2 rounded-full text-white bg-red-500 hover:bg-red-600 transition-colors focus:outline-none" aria-label="Limpiar chat">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
            </button>
        </div>
        
        <div id="message-container" class="flex-grow p-4 pt-20 pb-28 overflow-y-auto w-full flex flex-col">
            
            <div id="model-typing-bubble" class="flex justify-start mb-2 hidden">
                <div class="model-bubble-wrapper p-3 shadow-md flex items-center">
                    <div class="typing-dots">
                        <span class="dot"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                    </div>
                </div>
            </div>
            </div>

        <div id="bottom-bar-wrapper" class="bottom-action-area fixed bottom-0 left-0 right-0 w-full bg-white shadow-2xl p-3">
            
            <div id="category-chips-group" class="chip-group-scroll mb-2">
                <div class="flex space-x-2 px-1">
                    <button class="category-chip action-chip bg-indigo-500 text-white p-2 rounded-full text-sm font-semibold" data-query-es="Dime sobre la Categoría Salud y Estética en Progreso">🏥 Salud & Estética</button>
                    <button class="category-chip action-chip bg-indigo-500 text-white p-2 rounded-full text-sm font-semibold" data-query-es="Dime sobre la Categoría Compras y Tiendas en Progreso">🛍️ Compras</button>
                    <button class="category-chip action-chip bg-indigo-500 text-white p-2 rounded-full text-sm font-semibold" data-query-es="Dime sobre la Categoría Entretenimiento y Atracciones en Progreso">🎺 Entretenimiento</button>
                    <button class="category-chip action-chip bg-indigo-500 text-white p-2 rounded-full text-sm font-semibold" data-query-es="Información general de Progreso">ℹ️ Info</button>
                </div>
            </div>

            <div id="input-area-container" class="flex items-center space-x-2">
                <input type="text" id="user-input" class="flex-grow p-3 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Escribe tu pregunta..." autocomplete="off">
                <button id="send-message-button" class="action-btn bg-blue-500 text-white p-3 rounded-full transition-colors disabled:bg-gray-400" disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
    </div>
    
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=TU_CLAVE_API_DE_GOOGLE&libraries=places&callback=initChat"></script>
    <script src="js/main.js"></script>

</body>
</html>
